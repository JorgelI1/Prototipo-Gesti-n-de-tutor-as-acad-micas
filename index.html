<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Sistema de Tutorías UTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Architects Daughter', cursive, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        /* Estilos de Wireframe (Baja Fidelidad) */
        .wf-container {
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 6px 6px 0px #d1d5db;
            background-color: white;
        }
        .wf-input {
            border: 2px dashed #666;
            background: transparent;
            font-family: inherit;
        }
        .wf-input:focus {
            outline: none;
            border-color: #333;
            border-style: solid;
        }
        .wf-btn {
            border: 2px solid #333;
            background-color: #e5e7eb;
            box-shadow: 3px 3px 0px #9ca3af;
            transition: all 0.1s;
            font-weight: bold;
        }
        .wf-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #9ca3af;
        }
        .wf-nav-item {
            border-bottom: 2px dashed #ccc;
            cursor: pointer;
        }
        .wf-nav-item:hover, .wf-nav-item.active {
            font-weight: bold;
            border-bottom: 2px solid #333;
            background-color: #f3f4f6;
        }
        .wf-table th, .wf-table td {
            border: 2px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        .wf-table th {
            border-bottom: 3px solid #333;
            background-color: #f3f4f6;
        }
        .wf-modal {
            background: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- DEV TOOLBAR (Solo para simular navegación rápida entre roles) -->
    <div class="fixed top-0 left-0 w-full bg-black text-white p-2 text-xs flex gap-4 z-50 justify-center">
        <span>Simulador de Roles:</span>
        <button onclick="loginAs('estudiante')" class="underline hover:text-gray-300">Estudiante</button>
        <button onclick="loginAs('tutor')" class="underline hover:text-gray-300">Tutor</button>
        <button onclick="loginAs('coordinador')" class="underline hover:text-gray-300">Coordinador</button>
        <button onclick="loginAs('admin')" class="underline hover:text-gray-300">Administrador</button>
        <button onclick="logout()" class="underline text-red-300 hover:text-red-100">Cerrar Sesión</button>
    </div>

    <!-- PANTALLA DE INICIO (LOGIN) -->
    <div id="login-view" class="w-full max-w-md wf-container p-8 mt-10">
        <h1 class="text-3xl font-bold text-center mb-2">Sistema de Tutorías</h1>
        <p class="text-center text-gray-500 mb-8">Universidad Tecnológica de Panamá</p>
        
        <div class="space-y-4">
            <div>
                <label class="block mb-1 font-bold">Correo Institucional</label>
                <input type="text" class="w-full p-2 wf-input" value="usuario@utp.ac.pa">
            </div>
            <div>
                <label class="block mb-1 font-bold">Contraseña</label>
                <input type="password" class="w-full p-2 wf-input" value="123456">
            </div>
            
            <button onclick="loginAs('estudiante')" class="w-full p-3 wf-btn mt-4">Iniciar Sesión</button>
            
            <div class="text-center mt-4">
                <a href="#" class="text-sm underline">Olvidé mi contraseña</a>
            </div>
            
            <hr class="border-2 border-dashed border-gray-300 my-6">
            
            <button class="w-full p-3 wf-btn" style="background-color: white;">Registrarse como Estudiante</button>
        </div>
    </div>

    <!-- PANEL PRINCIPAL (DASHBOARD) -->
    <div id="dashboard-view" class="hidden w-full max-w-5xl wf-container flex flex-col h-[80vh] mt-10">
        <!-- HEADER -->
        <header class="border-b-4 border-gray-800 p-4 flex justify-between items-center bg-gray-100">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 border-2 border-black flex items-center justify-center font-bold bg-white">UTP</div>
                <h2 id="user-role-title" class="text-xl font-bold">Panel</h2>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-name">Usuario</span>
                <span class="text-xl cursor-pointer" title="Notificaciones">🔔</span>
                <button onclick="logout()" class="wf-btn px-3 py-1 text-sm">Salir</button>
            </div>
        </header>

        <!-- LAYOUT -->
        <div class="flex flex-1 overflow-hidden">
            <!-- SIDEBAR MENÚ -->
            <aside class="w-64 border-r-4 border-gray-800 bg-white overflow-y-auto" id="sidebar-menu">
                <!-- Generado dinámicamente -->
            </aside>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="flex-1 p-6 overflow-y-auto bg-white" id="main-content">
                <!-- Generado dinámicamente -->
            </main>
        </div>
    </div>

    <!-- MODAL DINÁMICO -->
    <div id="modal-container" class="fixed inset-0 wf-modal hidden flex items-center justify-center z-50">
        <div class="wf-container w-full max-w-lg p-6 bg-white relative">
            <button onclick="closeModal()" class="absolute top-2 right-4 text-2xl font-bold">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- SISTEMA DE NOTIFICACIONES (TOAST) -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        // ESTADO DE LA APLICACIÓN
        const state = {
            currentUser: null,
            currentRole: null,
            currentView: null
        };

        // ESTRUCTURA DE NAVEGACIÓN BASADA EN EL MODELO INICIAL DEL DOC
        const navigation = {
            estudiante: [
                { id: 'buscar_tutorias', label: 'Buscar Tutorías' },
                { id: 'mis_solicitudes', label: 'Mis Solicitudes' },
                { id: 'historial_est', label: 'Historial' }
            ],
            tutor: [
                { id: 'solicitudes_recibidas', label: 'Solicitudes' },
                { id: 'mi_agenda', label: 'Mi Agenda' },
                { id: 'disponibilidad', label: 'Disponibilidad' }
            ],
            coordinador: [
                { id: 'gestion_tutores', label: 'Gestión de Tutores' },
                { id: 'reservas_global', label: 'Reservas' },
                { id: 'reportes', label: 'Reportes' }
            ],
            admin: [
                { id: 'usuarios_roles', label: 'Usuarios y Roles' },
                { id: 'catalogos', label: 'Catálogos' },
                { id: 'bitacoras', label: 'Bitácoras' }
            ]
        };

        // LÓGICA DE INTERFAZ
        function loginAs(role) {
            state.currentRole = role;
            state.currentUser = `Juan (${role})`;
            
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            
            const titles = { estudiante: 'Portal Estudiantil', tutor: 'Portal del Tutor', coordinador: 'Coordinación', admin: 'Administración' };
            document.getElementById('user-role-title').innerText = titles[role];
            document.getElementById('user-name').innerText = state.currentUser;

            renderSidebar();
            // Cargar la primera vista por defecto
            loadView(navigation[role][0].id);
        }

        function logout() {
            state.currentRole = null;
            state.currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        }

        function renderSidebar() {
            const menu = navigation[state.currentRole];
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.innerHTML = '<div class="p-4 font-bold text-gray-500 border-b-2 border-dashed border-gray-300">Menú Principal</div>';
            
            menu.forEach(item => {
                const div = document.createElement('div');
                div.className = `p-4 wf-nav-item ${state.currentView === item.id ? 'active' : ''}`;
                div.innerText = item.label;
                div.onclick = () => loadView(item.id);
                sidebar.appendChild(div);
            });
        }

        function loadView(viewId) {
            state.currentView = viewId;
            renderSidebar(); // Actualiza clase active
            const main = document.getElementById('main-content');
            
            // Ruteador de Vistas basado en el Modelo de Navegación Inicial
            switch(viewId) {
                // RUTA ESTUDIANTE
                case 'buscar_tutorias':
                    main.innerHTML = `
                        <h3 class="text-2xl font-bold mb-4">Buscar Tutorías</h3>
                        <div class="flex gap-4 mb-6">
                            <input type="text" placeholder="Asignatura..." class="p-2 wf-input flex-1">
                            <select class="p-2 wf-input"><option>Cualquier Modalidad</option><option>Presencial</option><option>Virtual</option></select>
                            <button class="wf-btn px-4" onclick="showToast('Buscando...')">Filtrar</button>
                        </div>
                        <table class="w-full wf-table">
                            <tr><th>Asignatura</th><th>Tutor</th><th>Próximo Horario</th><th>Acción</th></tr>
                            <tr><td>Cálculo II</td><td>Ana Ramos</td><td>Jueves 14:00 (Presencial)</td><td><button class="wf-btn px-2 text-sm" onclick="abrirDetalleTutoria('Cálculo II', 'Ana Ramos')">Detalle / Solicitar</button></td></tr>
                            <tr><td>Física I</td><td>Carlos M.</td><td>Viernes 10:00 (Virtual)</td><td><button class="wf-btn px-2 text-sm" onclick="abrirDetalleTutoria('Física I', 'Carlos M.')">Detalle / Solicitar</button></td></tr>
                        </table>
                    `;
                    break;
                case 'mis_solicitudes':
                    main.innerHTML = `
                        <h3 class="text-2xl font-bold mb-4">Mis Solicitudes</h3>
                        <table class="w-full wf-table">
                            <tr><th>Tutoría</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr>
                            <tr><td>Cálculo II</td><td>Jueves 14:00</td><td>Pendiente</td><td><button class="wf-btn px-2 text-sm text-red-600" onclick="showToast('Solicitud Cancelada')">Cancelar</button></td></tr>
                            <tr><td>Programación</td><td>Ayer 09:00</td><td>Confirmada</td><td>-</td></tr>
                        </table>
                    `;
                    break;
                case 'historial_est':
                    main.innerHTML = `<h3 class="text-2xl font-bold mb-4">Historial de Tutorías</h3><div class="p-4 border-2 border-dashed border-gray-400">Listado de sesiones pasadas y valoraciones.</div>`;
                    break;

                // RUTA TUTOR
                case 'solicitudes_recibidas':
                    main.innerHTML = `
                        <h3 class="text-2xl font-bold mb-4">Solicitudes Recibidas</h3>
                        <div class="grid grid-cols-1 gap-4">
                            <div class="border-2 border-black p-4 bg-gray-50 flex justify-between items-center">
                                <div><strong>Luis Pérez</strong> solicita Física I<br><span class="text-sm">Viernes 10:00 AM</span></div>
                                <div class="flex gap-2">
                                    <button class="wf-btn px-3 py-1 bg-green-100" onclick="showToast('Solicitud Aceptada')">Aceptar</button>
                                    <button class="wf-btn px-3 py-1 bg-red-100" onclick="showToast('Solicitud Rechazada')">Rechazar</button>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'mi_agenda':
                    main.innerHTML = `
                        <h3 class="text-2xl font-bold mb-4">Mi Agenda</h3>
                        <table class="w-full wf-table">
                            <tr><th>Día/Hora</th><th>Estudiante</th><th>Materia</th><th>Acción</th></tr>
                            <tr><td>Hoy 14:00</td><td>Luis Pérez</td><td>Física I</td><td><button class="wf-btn px-2 text-sm" onclick="abrirRegistrarResultado()">Registrar Resultado</button></td></tr>
                            <tr><td>Mañana 10:00</td><td>María G.</td><td>Cálculo I</td><td>Pendiente de impartir</td></tr>
                        </table>
                    `;
                    break;
                case 'disponibilidad':
                    main.innerHTML = `<h3 class="text-2xl font-bold mb-4">Disponibilidad</h3><button class="wf-btn p-2 mb-4">+ Agregar Bloque Horario</button><div class="p-4 border-2 border-dashed border-gray-400">Calendario de bloques horarios.</div>`;
                    break;

                // RUTA COORDINADOR
                case 'gestion_tutores':
                    main.innerHTML = `
                        <h3 class="text-2xl font-bold mb-4">Gestión de Tutores</h3>
                        <table class="w-full wf-table">
                            <tr><th>Nombre</th><th>Materias</th><th>Estado</th><th>Acciones</th></tr>
                            <tr><td>Ana Ramos</td><td>Cálculo II, III</td><td>Aprobado</td><td><button class="wf-btn px-2 text-sm">Gestionar</button></td></tr>
                            <tr><td>Pedro Gil</td><td>Química General</td><td>Pendiente</td><td><button class="wf-btn px-2 text-sm">Aprobar</button></td></tr>
                        </table>
                    `;
                    break;
                case 'reservas_global':
                    main.innerHTML = `<h3 class="text-2xl font-bold mb-4">Reservas Globales</h3><div class="p-4 border-2 border-dashed border-gray-400">Vista de todas las reservas del programa para reasignar o monitorear conflictos.</div>`;
                    break;
                case 'reportes':
                    main.innerHTML = `<h3 class="text-2xl font-bold mb-4">Reportes y Estadísticas</h3><div class="flex gap-4 mb-4"><select class="p-2 wf-input"><option>Cobertura</option><option>Asistencia</option></select><button class="wf-btn p-2" onclick="showToast('Generando reporte...')">Generar</button></div><div class="h-40 border-2 border-black flex items-center justify-center bg-gray-100">[ Gráfico de Barras ]</div>`;
                    break;

                // RUTA ADMIN
                case 'usuarios_roles':
                    main.innerHTML = `
                        <h3 class="text-2xl font-bold mb-4">Usuarios y Roles</h3>
                        <button class="wf-btn p-2 mb-4" onclick="showToast('Abriendo formulario...')">+ Registrar Trabajador</button>
                        <table class="w-full wf-table">
                            <tr><th>Usuario</th><th>Correo</th><th>Rol Actual</th><th>Asignar Rol</th></tr>
                            <tr><td>Ing. Roberto</td><td>roberto@utp.ac.pa</td><td>Pendiente</td><td><select class="p-1 wf-input text-sm"><option>Tutor</option><option>Coordinador</option></select> <button class="wf-btn px-1">Ok</button></td></tr>
                        </table>
                    `;
                    break;
                case 'catalogos':
                    main.innerHTML = `<h3 class="text-2xl font-bold mb-4">Catálogos</h3><div class="p-4 border-2 border-dashed border-gray-400">Mantenimiento de Facultades, Carreras, Asignaturas y Recintos.</div>`;
                    break;
                case 'bitacoras':
                    main.innerHTML = `<h3 class="text-2xl font-bold mb-4">Bitácoras del Sistema</h3><div class="p-4 border-2 border-dashed border-gray-400">Registro de errores y actividad de usuarios.</div>`;
                    break;

                default:
                    main.innerHTML = `<h3>Vista no encontrada</h3>`;
            }
        }

        // FUNCIONES DE MODALES Y VISTAS SECUNDARIAS
        function abrirDetalleTutoria(materia, tutor) {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <h3 class="text-xl font-bold mb-2">Detalle de Tutoría</h3>
                <p class="mb-4"><strong>Materia:</strong> ${materia}<br><strong>Tutor:</strong> ${tutor}</p>
                <label class="block mb-1 font-bold">Seleccionar Horario Disponible:</label>
                <select class="w-full p-2 wf-input mb-4"><option>Jueves 14:00 - Presencial</option><option>Jueves 15:00 - Presencial</option></select>
                <button class="w-full p-3 wf-btn" onclick="showToast('Solicitud enviada al tutor'); closeModal()">Confirmar Solicitud</button>
            `;
            modal.classList.remove('hidden');
        }

        function abrirRegistrarResultado() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <h3 class="text-xl font-bold mb-2">Registrar Resultado</h3>
                <label class="flex items-center gap-2 mb-3"><input type="checkbox" class="w-5 h-5"> El estudiante asistió</label>
                <label class="block mb-1 font-bold">Tema Trabajado:</label>
                <input type="text" class="w-full p-2 wf-input mb-3" placeholder="Ej. Derivadas parciales...">
                <label class="block mb-1 font-bold">Observaciones (Opcional):</label>
                <textarea class="w-full p-2 wf-input mb-4" rows="2"></textarea>
                <button class="w-full p-3 wf-btn" onclick="showToast('Resultado registrado en el historial'); closeModal()">Guardar</button>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'bg-black text-white px-4 py-2 rounded shadow-lg transition-opacity duration-500';
            toast.innerText = message;
            
            const container = document.getElementById('toast-container');
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
