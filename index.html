<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo - Gestión de Tutorías UTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilos personalizados para animaciones y scroll */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
        .toast-enter { animation: slideInRight 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden">

    <!-- CONTENEDOR PRINCIPAL DE LA APP -->
    <div id="app" class="w-full h-full flex flex-col"></div>

    <!-- CONTENEDOR DE NOTIFICACIONES (TOASTS) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

    <script>
        // ==========================================
        // 1. ESTADO GLOBAL Y DATOS MOCKEADOS
        // ==========================================
        const state = {
            isLoggedIn: false,
            currentUser: null,
            currentView: '',
            menuConfig: {
                // Modelo de Navegación Inicial exacto según documento Fase 1
                'Estudiante': [
                    { id: 'buscar-tutorias', label: 'Buscar Tutorías', icon: 'fa-search' },
                    { id: 'mis-solicitudes', label: 'Mis Solicitudes', icon: 'fa-calendar-check' },
                    { id: 'historial', label: 'Historial', icon: 'fa-history' }
                ],
                'Tutor': [
                    { id: 'solicitudes-tutor', label: 'Solicitudes', icon: 'fa-inbox' },
                    { id: 'mi-agenda', label: 'Mi Agenda', icon: 'fa-book-open' },
                    { id: 'disponibilidad', label: 'Disponibilidad', icon: 'fa-clock' }
                ],
                'Coordinador': [
                    { id: 'gestion-tutores', label: 'Gestión de Tutores', icon: 'fa-users-cog' },
                    { id: 'reservas', label: 'Reservas', icon: 'fa-calendar-alt' },
                    { id: 'reportes', label: 'Reportes', icon: 'fa-chart-bar' }
                ],
                'Administrador': [
                    { id: 'usuarios-roles', label: 'Usuarios y Roles', icon: 'fa-user-shield' },
                    { id: 'catalogos', label: 'Catálogos', icon: 'fa-folder-tree' },
                    { id: 'bitacoras', label: 'Bitácoras', icon: 'fa-clipboard-list' }
                ]
            }
        };

        // ==========================================
        // 2. SISTEMA DE NOTIFICACIONES Y MODALES
        // ==========================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-blue-600');
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');
            
            toast.className = `toast-enter flex items-center p-4 text-white rounded-lg shadow-lg ${bg}`;
            toast.innerHTML = `<i class="fas ${icon} mr-3 text-lg"></i> <span class="font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function openModal(title, contentHTML, actionsHTML) {
            const modalHtml = `
                <div id="dynamic-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
                    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg fade-in overflow-hidden">
                        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-blue-900 text-white">
                            <h3 class="text-lg font-bold">${title}</h3>
                            <button onclick="closeModal()" class="text-white hover:text-red-300 transition"><i class="fas fa-times text-xl"></i></button>
                        </div>
                        <div class="p-6 text-slate-600">${contentHTML}</div>
                        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">${actionsHTML}</div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function closeModal() {
            const modal = document.getElementById('dynamic-modal');
            if (modal) modal.remove();
        }

        // ==========================================
        // 3. ENRUTADOR Y RENDERIZADO PRINCIPAL
        // ==========================================
        function renderApp() {
            const app = document.getElementById('app');
            if (!state.isLoggedIn) {
                app.innerHTML = getLoginHTML();
            } else {
                app.innerHTML = getLayoutHTML();
                renderMenu();
                navigate(state.menuConfig[state.currentUser.role][0].id); // Navegar a la primera opción por defecto
            }
        }

        function login(role) {
            state.isLoggedIn = true;
            state.currentUser = { name: `Usuario ${role}`, role: role };
            showToast(`Sesión iniciada como ${role}`);
            renderApp();
        }

        function logout() {
            state.isLoggedIn = false;
            state.currentUser = null;
            showToast('Sesión cerrada correctamente', 'info');
            renderApp();
        }

        function navigate(viewId) {
            state.currentView = viewId;
            // Actualizar menú activo
            document.querySelectorAll('.menu-item').forEach(el => {
                if(el.dataset.view === viewId) {
                    el.classList.add('bg-blue-800', 'border-l-4', 'border-white');
                    el.classList.remove('hover:bg-blue-800');
                } else {
                    el.classList.remove('bg-blue-800', 'border-l-4', 'border-white');
                    el.classList.add('hover:bg-blue-800');
                }
            });
            // Renderizar vista
            const contentArea = document.getElementById('main-content');
            contentArea.innerHTML = getViewController(viewId);
        }

        // ==========================================
        // 4. COMPONENTES ESTRUCTURALES (HTML)
        // ==========================================
        function getLoginHTML() {
            return `
                <div class="w-full h-full flex items-center justify-center bg-blue-900 bg-opacity-5">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-900 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-3xl font-bold">UTP</div>
                            <h1 class="text-2xl font-bold text-slate-800">Tutorías Académicas</h1>
                            <p class="text-slate-500 mt-2 text-sm">Inicio de Sesión / Registro</p>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Correo Institucional</label>
                                <input type="email" value="usuario@utp.ac.pa" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                                <input type="password" value="******" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div class="pt-4 border-t border-slate-100 mt-4">
                                <p class="text-xs text-center text-slate-500 mb-3">Selector rápido para evaluación (Wireframe)</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="login('Estudiante')" class="bg-blue-100 text-blue-800 py-2 rounded-lg text-sm font-semibold hover:bg-blue-200 transition">Entrar Estudiante</button>
                                    <button onclick="login('Tutor')" class="bg-emerald-100 text-emerald-800 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-200 transition">Entrar Tutor</button>
                                    <button onclick="login('Coordinador')" class="bg-amber-100 text-amber-800 py-2 rounded-lg text-sm font-semibold hover:bg-amber-200 transition">Entrar Coordinador</button>
                                    <button onclick="login('Administrador')" class="bg-purple-100 text-purple-800 py-2 rounded-lg text-sm font-semibold hover:bg-purple-200 transition">Entrar Admin</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getLayoutHTML() {
            return `
                <!-- HEADER -->
                <header class="bg-blue-900 text-white h-16 flex items-center justify-between px-6 shadow-md z-10 shrink-0">
                    <div class="flex items-center gap-4">
                        <div class="font-bold text-xl tracking-tight">UTP Tutorías</div>
                        <span class="bg-blue-800 px-3 py-1 rounded-full text-xs font-medium border border-blue-700">${state.currentUser.role}</span>
                    </div>
                    <div class="flex items-center gap-6">
                        <button class="relative hover:text-blue-200 transition">
                            <i class="fas fa-bell text-xl"></i>
                            <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">3</span>
                        </button>
                        <div class="flex items-center gap-3 border-l border-blue-800 pl-6">
                            <i class="fas fa-user-circle text-2xl text-blue-300"></i>
                            <span class="font-medium text-sm hidden md:block">${state.currentUser.name}</span>
                            <button onclick="logout()" class="ml-2 text-blue-300 hover:text-white transition" title="Cerrar sesión">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="flex flex-1 overflow-hidden">
                    <!-- SIDEBAR -->
                    <aside class="w-64 bg-blue-900 text-blue-100 flex flex-col shrink-0 shadow-inner">
                        <div class="p-4 text-xs font-semibold text-blue-400 uppercase tracking-wider mb-2 mt-4">Navegación Principal</div>
                        <nav id="sidebar-menu" class="flex-1 flex flex-col gap-1 px-2"></nav>
                    </aside>

                    <!-- CONTENIDO DINÁMICO -->
                    <main class="flex-1 bg-slate-50 p-8 overflow-y-auto" id="main-content">
                        <!-- Vistas renderizadas por JS -->
                    </main>
                </div>
            `;
        }

        function renderMenu() {
            const menuContainer = document.getElementById('sidebar-menu');
            const items = state.menuConfig[state.currentUser.role] || [];
            menuContainer.innerHTML = items.map(item => `
                <button data-view="${item.id}" onclick="navigate('${item.id}')" class="menu-item flex items-center gap-3 w-full text-left px-4 py-3 rounded-lg font-medium transition duration-200">
                    <i class="fas ${item.icon} w-5 text-center"></i>
                    ${item.label}
                </button>
            `).join('');
        }

        // ==========================================
        // 5. CONTROLADOR DE VISTAS (LÓGICA DEL WIREFRAME)
        // ==========================================
        function getViewController(viewId) {
            let html = `<div class="fade-in max-w-6xl mx-auto">`;
            
            // --- VISTAS DEL ESTUDIANTE ---
            if (viewId === 'buscar-tutorias') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Buscar Tutorías</h2>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex gap-4 items-end">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Asignatura</label>
                            <select class="w-full border border-slate-300 rounded-lg p-2"><option>Cálculo II</option><option>Programación I</option></select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Modalidad</label>
                            <select class="w-full border border-slate-300 rounded-lg p-2"><option>Cualquiera</option><option>Presencial</option><option>Virtual</option></select>
                        </div>
                        <button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Buscar</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">Cálculo II</span>
                                    <h3 class="font-bold text-lg mt-2 text-slate-800">Prof. Juan Pérez</h3>
                                </div>
                                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2 py-1 rounded flex items-center gap-1"><i class="fas fa-users"></i> 3 cupos</span>
                            </div>
                            <p class="text-slate-500 text-sm mb-4"><i class="fas fa-map-marker-alt w-4"></i> Edificio 3, Aula 302 (Presencial)</p>
                            <p class="text-slate-700 font-medium text-sm mb-4"><i class="far fa-clock w-4 text-slate-400"></i> Jueves, 14:00 - 15:30</p>
                            <!-- Nodo: Detalle / Solicitar -->
                            <button onclick="simularSolicitud()" class="mt-auto w-full bg-blue-50 text-blue-700 border border-blue-200 py-2 rounded-lg font-semibold hover:bg-blue-600 hover:text-white transition">Ver Detalle / Solicitar</button>
                        </div>
                    </div>
                `;
            } 
            else if (viewId === 'mis-solicitudes') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Mis Solicitudes Activas</h2>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-sm text-slate-500"><th class="p-4">Asignatura</th><th class="p-4">Fecha/Hora</th><th class="p-4">Estado</th><th class="p-4 text-right">Acción</th></tr></thead>
                            <tbody>
                                <tr class="border-b border-slate-100">
                                    <td class="p-4 font-medium text-slate-800">Física I</td>
                                    <td class="p-4 text-slate-600 text-sm">Lun 12 Oct, 10:00</td>
                                    <td class="p-4"><span class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-1 rounded">Pendiente</span></td>
                                    <td class="p-4 text-right">
                                        <!-- Nodo: Cancelar Solicitud -->
                                        <button onclick="simularCancelacion()" class="text-rose-600 hover:text-rose-800 text-sm font-medium"><i class="fas fa-times-circle mr-1"></i> Cancelar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
            else if (viewId === 'historial') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Historial de Tutorías</h2>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 text-center text-slate-500">
                        <i class="fas fa-history text-4xl mb-3 text-slate-300"></i>
                        <p>Aquí se listarán las tutorías a las que has asistido en semestres anteriores.</p>
                    </div>
                `;
            }

            // --- VISTAS DEL TUTOR ---
            else if (viewId === 'solicitudes-tutor') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Solicitudes de Estudiantes</h2>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-sm text-slate-500"><th class="p-4">Estudiante</th><th class="p-4">Materia / Horario</th><th class="p-4 text-right">Acciones</th></tr></thead>
                            <tbody>
                                <tr class="border-b border-slate-100">
                                    <td class="p-4"><div class="font-medium text-slate-800">Carlos Díaz</div><div class="text-xs text-slate-500">carlos.diaz@utp.ac.pa</div></td>
                                    <td class="p-4"><div class="font-medium text-slate-700">Cálculo II</div><div class="text-xs text-slate-500">Jueves 15, 14:00</div></td>
                                    <td class="p-4 text-right">
                                        <!-- Nodo: Aceptar / Rechazar -->
                                        <button onclick="showToast('Solicitud Aceptada y agregada a tu agenda')" class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded text-sm font-medium hover:bg-emerald-200 mr-2">Aceptar</button>
                                        <button onclick="simularRechazo()" class="bg-rose-100 text-rose-800 px-3 py-1 rounded text-sm font-medium hover:bg-rose-200">Rechazar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
            else if (viewId === 'mi-agenda') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Mi Agenda de Tutorías</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white border-l-4 border-blue-600 p-5 rounded-r-xl shadow-sm">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-lg text-slate-800">Programación I</h3>
                                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">Hoy, 16:00</span>
                            </div>
                            <p class="text-slate-600 text-sm mt-2">Estudiantes confirmados: 2</p>
                            <div class="mt-4 pt-4 border-t border-slate-100 flex gap-2">
                                <!-- Nodo: Registrar Resultado -->
                                <button onclick="simularRegistroResultado()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 w-full text-center transition">Registrar Resultado</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (viewId === 'disponibilidad') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Configurar Disponibilidad</h2>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm max-w-2xl">
                        <p class="text-slate-600 mb-4 text-sm">Agrega los bloques de tiempo en los que estás disponible para brindar tutorías esta semana.</p>
                        <button onclick="showToast('Bloque de horario agregado correctamente')" class="bg-blue-50 text-blue-700 border border-blue-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-100 transition"><i class="fas fa-plus mr-2"></i>Añadir Horario</button>
                    </div>
                `;
            }

            // --- VISTAS DEL COORDINADOR ---
            else if (viewId === 'gestion-tutores') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Gestión de Tutores</h2>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-sm text-slate-500"><th class="p-4">Nombre Tutor</th><th class="p-4">Materias Asignadas</th><th class="p-4 text-right">Acción</th></tr></thead>
                            <tbody>
                                <tr class="border-b border-slate-100">
                                    <td class="p-4 font-medium text-slate-800">Ana Ruiz</td>
                                    <td class="p-4 text-slate-600 text-sm">Física I, Física II</td>
                                    <td class="p-4 text-right"><button onclick="showToast('Aprobación actualizada')" class="text-blue-600 hover:text-blue-800 text-sm font-medium">Revisar Perfil</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
            else if (viewId === 'reservas') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Control Global de Reservas</h2>
                    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500">
                        <i class="fas fa-calendar-alt text-4xl mb-3 text-slate-300"></i>
                        <p>Vista general de todas las tutorías programadas en el sistema para reasignación o cancelación administrativa.</p>
                    </div>
                `;
            }
            else if (viewId === 'reportes') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Estadísticas y Reportes</h2>
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm border-t-4 border-t-blue-500">
                            <div class="text-slate-500 text-sm font-medium">Tutorías Realizadas</div>
                            <div class="text-3xl font-bold text-slate-800 mt-2">142</div>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm border-t-4 border-t-emerald-500">
                            <div class="text-slate-500 text-sm font-medium">Asistencia Promedio</div>
                            <div class="text-3xl font-bold text-slate-800 mt-2">94%</div>
                        </div>
                    </div>
                    <button onclick="showToast('Generando reporte PDF...', 'info')" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition"><i class="fas fa-download mr-2"></i> Exportar Datos</button>
                `;
            }

            // --- VISTAS DEL ADMINISTRADOR ---
            else if (viewId === 'usuarios-roles') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Gestión de Usuarios y Roles</h2>
                    <button onclick="showToast('Abriendo formulario de nuevo usuario...')" class="mb-4 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition"><i class="fas fa-user-plus mr-2"></i>Registrar Trabajador</button>
                    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500">
                        <p>Tabla de administración central de cuentas, asignación de roles (Tutor/Coordinador) y desactivaciones.</p>
                    </div>
                `;
            }
            else if (viewId === 'catalogos') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Mantenimiento de Catálogos</h2>
                    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500">
                        <i class="fas fa-folder-tree text-4xl mb-3 text-slate-300"></i>
                        <p>Gestión de facultades, carreras, asignaturas y recintos institucionales.</p>
                    </div>
                `;
            }
            else if (viewId === 'bitacoras') {
                html += `
                    <h2 class="text-2xl font-bold text-slate-800 mb-6">Bitácoras del Sistema</h2>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead><tr class="bg-slate-50 text-slate-500"><th class="p-3">Fecha</th><th class="p-3">Acción</th><th class="p-3">Usuario</th></tr></thead>
                            <tbody>
                                <tr class="border-t border-slate-100"><td class="p-3 text-slate-500">Hace 5 min</td><td class="p-3 font-medium text-slate-700">Cambio de rol (A Tutor)</td><td class="p-3">admin@utp.ac.pa</td></tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }

            html += `</div>`;
            return html;
        }

        // ==========================================
        // 6. SIMULACIÓN DE FLUJOS (INTERACCIÓN)
        // ==========================================
        function simularSolicitud() {
            const content = `
                <div class="space-y-3">
